<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Celebration ❤️</title>

    <link rel="stylesheet" href="c/celebration.css">
    <script src="js/celebration.js" defer></script>
</head>

<body>

    <main class="party-container">

        <p class="tagline">TODAY IS ALL ABOUT YOU ❤️</p>

        <h1>Happy Birthday, Rohan!</h1>

        <p class="subtitle">
            Your little birthday celebration starts here.
        </p>

        <!-- Birthday Cake -->

        <section class="cake-section">

            <div class="cake" id="cake">
                <div class="candles">
                    <span class="candle">🕯️</span>
                    <span class="candle">🕯️</span>
                    <span class="candle">🕯️</span>
                </div>

                <div class="cake-emoji">🎂</div>
            </div>

            <h2>Make a Birthday Wish!</h2>

            <button id="blowButton">
                Blow the Candles 🕯️
            </button>

            <button id="cutButton" disabled>
                Cut Your Birthday Cake 🔪
            </button>

            <p id="cakeMessage"></p>

        </section>

        <!-- Balloon Game -->

        <section class="balloon-section">

            <h2>Pop Your Birthday Balloons! 🎈</h2>

            <p>
                Pop all 10 balloons to unlock your surprises.
            </p>

            <div class="balloon-container" id="balloonContainer"></div>

            <p id="balloonCount">Balloons popped: 0/10</p>

            <div id="surpriseMessage"></div>

        </section>

        <a href="quiz.html" class="next-button">
            Next Surprise: Rohan's Quiz 😂 →
        </a>

        <p class="footer">ROOKANSH FOREVER ♾️</p>

    </main>

</body>
</html>
